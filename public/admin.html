<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Admin | Taste Veelicious</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{--bg:#050505;--card:#121110;--line:#2a2623;--tx:#f5efe8;--mu:#a39b93;--or:#f7941d;--am:#ffc02e}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.5 Figtree,sans-serif;padding:20px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif}svg.lucide{width:1.1em;height:1.1em;vertical-align:-.2em}
.w{max-width:960px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;color:var(--mu);font-size:.88rem;margin:10px 0 4px}
input,textarea,select{width:100%;background:#151311;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--tx);font:inherit}
input:focus,textarea:focus{border-color:var(--or);outline:0}
.btn{display:inline-flex;gap:8px;align-items:center;border:0;cursor:pointer;border-radius:99px;padding:11px 20px;font:600 1rem Figtree;background:linear-gradient(135deg,var(--or),var(--am));color:#1a0f00}
.btn.o{background:none;color:var(--tx);border:1px solid var(--line)}.btn.d{background:none;color:#ff7b6b;border:1px solid #4a2420}
.p{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.p .t{width:64px;height:64px;border-radius:12px;background:#1c1612;display:grid;place-items:center;color:var(--or);overflow:hidden}.p .t img{width:100%;height:100%;object-fit:cover}
.mu{color:var(--mu);font-size:.9rem}.act{display:flex;gap:8px;flex-wrap:wrap}
#msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:11px 20px;border-radius:99px;font-weight:600;display:none;z-index:9}
#login{max-width:380px;margin:12vh auto}.err{color:#ff7b6b;margin-top:10px;min-height:1.4em}
</style></head><body>
<div id="login" class="box"><h1 style="margin-bottom:6px">Admin sign in</h1><p class="mu">Taste Veelicious store manager</p>
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="err" id="err"></div>
<button class="btn" id="go" style="width:100%;justify-content:center"><i data-lucide="log-in"></i>Sign in</button></div>

<div class="w" id="app" hidden>
<div class="top"><h1>Store manager</h1><div class="act"><a class="btn o" href="/" target="_blank"><i data-lucide="external-link"></i>View store</a><button class="btn" id="save"><i data-lucide="save"></i>Publish changes</button></div></div>

<div class="box"><h2>Order contact</h2><p class="mu">Orders are sent to this WhatsApp number. Use the full number; a leading 0 is treated as Nigeria (+234).</p>
<div class="g"><div><label for="sn">Store name</label><input id="sn"></div><div><label for="sw">WhatsApp number</label><input id="sw" type="tel"></div><div><label for="se">Email</label><input id="se" type="email"></div></div></div>

<div class="box"><h2 id="ft">Add product</h2>
<div class="g"><div><label for="pn">Name</label><input id="pn"></div><div><label for="pp">Price (₦)</label><input id="pp" type="number" min="0"></div>
<div><label for="pc">Category</label><input id="pc" list="cats" placeholder="Mains, Drinks..."><datalist id="cats"></datalist></div></div>
<label for="pd">Description</label><textarea id="pd" rows="2"></textarea>
<div class="g"><div><label for="pi">Photo</label><input id="pi" type="file" accept="image/*"></div><div><label for="pa">Availability</label><select id="pa"><option value="1">In stock</option><option value="0">Sold out</option></select></div></div>
<p class="mu" id="up" style="margin-top:8px"></p>
<div class="act" style="margin-top:14px"><button class="btn" id="add"><i data-lucide="plus"></i><span>Add product</span></button><button class="btn o" id="cancel" hidden>Cancel edit</button></div></div>

<div class="box"><h2>Products</h2><div id="list"></div></div></div>
<div id="msg"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let pw=sessionStorage.getItem('tvpw')||'',P=[],S={},img='',editId=null,busy=false;
const msg=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2600)};
const api=async b=>{const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw},body:JSON.stringify(b)});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};
async function enter(){await api({action:'login'});sessionStorage.setItem('tvpw',pw);$('#login').hidden=true;$('#app').hidden=false;
 const d=await (await fetch('/api/data')).json();S={name:'Taste Veelicious',whatsapp:'07066506886',email:'Ijandipeimoleayo@gmail.com',...(d.settings||{})};P=d.products||[];
 $('#sn').value=S.name;$('#sw').value=S.whatsapp;$('#se').value=S.email;draw()}
$('#go').onclick=async()=>{pw=$('#pw').value;try{await enter()}catch(e){$('#err').textContent=e.message}};
$('#pw').onkeydown=e=>{if(e.key=='Enter')$('#go').click()};
if(pw)enter().catch(()=>{pw=''});
function draw(){$('#cats').innerHTML=[...new Set(P.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('');
 $('#list').innerHTML=P.length?P.map(p=>`<div class="p"><div class="t">${p.image?`<img src="${esc(p.image)}" alt="">`:'<i data-lucide="chef-hat"></i>'}</div><div><b>${esc(p.name)}</b><div class="mu">₦${Number(p.price).toLocaleString()} | ${esc(p.category||'No category')} | ${p.available===false?'Sold out':'In stock'}</div></div><div class="act"><button class="btn o" data-e="${p.id}" aria-label="Edit"><i data-lucide="pencil"></i></button><button class="btn d" data-x="${p.id}" aria-label="Delete"><i data-lucide="trash-2"></i></button></div></div>`).join(''):'<p class="mu">No products yet. Add your first one above.</p>';lucide.createIcons()}
$('#pi').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#up').textContent='Uploading photo...';
 try{const bm=await createImageBitmap(f),k=Math.min(1,1000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=bm.width*k;c.height=bm.height*k;c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
 img=(await api({action:'upload',data:c.toDataURL('image/jpeg',.82)})).url;$('#up').textContent='Photo ready.'}catch(x){$('#up').textContent='Upload failed: '+x.message}};
function reset(){editId=null;img='';['pn','pp','pc','pd','pi'].forEach(i=>$('#'+i).value='');$('#pa').value='1';$('#up').textContent='';$('#ft').textContent='Add product';$('#add span').textContent='Add product';$('#cancel').hidden=true}
$('#cancel').onclick=reset;
$('#add').onclick=()=>{const n=$('#pn').value.trim(),pr=Number($('#pp').value);if(!n||!(pr>=0)||$('#pp').value==='')return msg('Enter a name and price');
 const o={id:editId||String(Date.now()),name:n,price:pr,category:$('#pc').value.trim(),description:$('#pd').value.trim(),image:img,available:$('#pa').value=='1'};
 editId?P=P.map(p=>p.id==editId?o:p):P.push(o);reset();draw();msg('Product saved. Press Publish changes to go live.')};
$('#list').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.x){if(confirm('Delete this product?')){P=P.filter(p=>p.id!=b.dataset.x);draw()}}
 if(b.dataset.e){const p=P.find(x=>x.id==b.dataset.e);editId=p.id;img=p.image||'';$('#pn').value=p.name;$('#pp').value=p.price;$('#pc').value=p.category||'';$('#pd').value=p.description||'';$('#pa').value=p.available===false?'0':'1';
 $('#ft').textContent='Edit product';$('#add span').textContent='Update product';$('#cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}};
$('#save').onclick=async()=>{if(busy)return;busy=true;S={name:$('#sn').value.trim(),whatsapp:$('#sw').value.trim(),email:$('#se').value.trim()};
 try{await api({action:'save',products:P,settings:S});msg('Published. Your store is updated.')}catch(e){msg(e.message)}busy=false};
lucide.createIcons();
</script></body></html>
